# Wet/dry cycling, which is where the irreversible part of the ARI model earns
# its place: plasticization recovers on every dry leg, hydrolysis damage does
# not, so the index ratchets down cycle by cycle.
#
# A humidity schedule forces the finite-volume solver -- the analytical series
# assumes a constant surface condition and cannot express this.
name: epoxy_humidity_cycling

film:
  thickness_um: 150
  exposure: one_sided

polymer:
  diffusivity_ref: 5.0e-13
  temperature_ref_c: 25
  activation_energy: 50.0e3
  tg_dry_c: 110
  tg_depression_per_pct: 15
  isotherm:
    m_ref_pct: 2.2
    exponent: 0.85

exposure:
  temperature_c: 65
  # Normalization reference: uptake is reported against equilibrium at RH = 0.95,
  # the wet leg of the cycle.
  relative_humidity: 0.95
  duration_days: 40
  # Uniform sampling, needed to resolve the cycles.
  n_times: 1200
  time_spacing: linear
  humidity_schedule:
    type: cycle
    time_unit: d
    high: 0.95
    low: 0.05
    period: 8
    n_cycles: 5
    duty: 0.5
    ramp: 0.25

adhesion:
  # Slow enough that damage stays in its sensitive range across all five cycles
  # instead of saturating in the first one. With a faster rate the index drops to
  # its floor immediately and the per-cycle ratcheting this example exists to
  # show becomes invisible.
  hydrolysis_rate_ref: 1.0e-8

ari_threshold: 0.75
