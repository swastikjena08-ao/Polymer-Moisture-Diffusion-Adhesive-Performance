[build-system]
# 64 or newer for PEP 660 editable installs. The system setuptools here is older
# than that, which is why `pip install -e .` fails; uv builds in an isolated
# environment with its own setuptools, so this works regardless.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hygroadh"
version = "0.1.0"
description = "Computational study of moisture diffusion in polymer adhesive films"
readme = "README.md"
requires-python = ">=3.10"
# numpy is the only runtime dependency. Everything else -- the solvers, the
# dashboard server, CSV export -- is numpy plus the standard library.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# Reading YAML configs. JSON configs work with no optional dependency at all.
yaml = ["pyyaml>=5.4"]

[dependency-groups]
# Installed by default by `uv sync`, so a fresh checkout can run the suite and
# read the example YAML configs without extra flags.
dev = ["pytest>=7", "pyyaml>=5.4"]

[project.scripts]
hygroadh = "hygroadh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hygroadh = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
